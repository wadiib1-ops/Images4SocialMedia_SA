name: Follower-Zahlen holen
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
concurrency:
  group: followers
  cancel-in-progress: false
jobs:
  followers:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Follower holen
        env:
          META_USER_TOKEN: ${{ secrets.META_USER_TOKEN }}
        run: python3 publisher/followers.py
      - name: Ergebnis zurückschreiben
        run: |
          git config user.name "publisher-bot"
          git config user.email "publisher-bot@users.noreply.github.com"
          git add publisher/followers.json publisher/followers_log.jsonl
          if git diff --cached --quiet; then echo "Keine Änderungen."; exit 0; fi
          git commit -m "Follower-Zahlen $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done
