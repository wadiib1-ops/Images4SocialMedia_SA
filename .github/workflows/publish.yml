name: publish

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Veröffentlichen
        env:
          META_USER_TOKEN: ${{ secrets.META_USER_TOKEN }}
        run: python3 publisher/publish.py

      - name: Log committen
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add publisher/log.jsonl publisher/queue.json
          if ! git diff --cached --quiet; then
            git commit -m "Log: Veröffentlichungslauf"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
